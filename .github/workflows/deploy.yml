# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the site URL
        id: site
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ]; then
            echo "url=https://$(head -n1 public/CNAME)" >> "$GITHUB_OUTPUT"; echo "base=/" >> "$GITHUB_OUTPUT"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            echo "url=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"; echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"; echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: ${{ steps.site.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
